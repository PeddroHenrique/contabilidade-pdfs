# Perfil de desenvolvimento (ativado automaticamente pelo ./mvnw spring-boot:run).
# Os dados ficam dentro do projeto, na pasta dados-dev/ (ignorada pelo Git).
app.diretorio-dados=./dados-dev

# Mostra o SQL gerado pelo Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recarrega os templates sem reiniciar a aplicação
spring.thymeleaf.cache=false
