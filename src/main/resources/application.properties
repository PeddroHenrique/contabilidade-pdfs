# Configuracao padrao: usada pela aplicacao instalada na maquina do cliente.
# Em desenvolvimento, application-dev.properties sobrescreve o que for preciso.

# Pasta onde ficam todos os dados (banco, PDFs). Fora da pasta de instalacao,
# para nao ser apagada ao atualizar a aplicacao.
# No Windows usa %LOCALAPPDATA%; em outros sistemas, a pasta do usuario.
app.diretorio-dados=${LOCALAPPDATA:${user.home}}/ContabilidadePDFs
app.upload-dir=${app.diretorio-dados}/arquivos

# Banco H2 embutido, gravado em arquivo
spring.datasource.url=jdbc:h2:file:${app.diretorio-dados}/banco/contabilidade
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: o esquema e criado pelo Flyway; o Hibernate so confere se bate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Tamanho maximo de upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.usuario.login=admin
app.usuario.senha=